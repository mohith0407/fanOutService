syntax = "proto3";

// The namespace for our generated C++ code
package social;

// --- 1. DATA STRUCTURES (Messages) ---

// Represents a single Post
message Post {
    int32 id = 1;         // The "= 1" is a unique tag for binary serialization, not the value!
    int32 author_id = 2;
    string content = 3;
}

// Input required to create a post
message CreatePostRequest {
    int32 user_id = 1;
    string content = 2;
}

// Output returned after creating a post
message CreatePostResponse {
    bool success = 1;
    string message = 2;
}

// Input required to view a feed (with pagination!)
message GetFeedRequest {
    int32 user_id = 1;
    int32 offset = 2;
    int32 limit = 3;
}

// Output containing the list of posts
message GetFeedResponse {
    repeated Post posts = 1; // "repeated" means an array/vector of Posts
}

// --- 2. THE API SERVICE (Functions) ---

service FeedApi {
    // A mobile app calls this to post a status
    rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
    
    // A mobile app calls this to load the timeline
    rpc GetFeed(GetFeedRequest) returns (GetFeedResponse);
}